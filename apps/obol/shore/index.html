<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Back on the shore · Obol</title>
<meta name="description" content="Charon turned the boat around. This tab is back on the shore.">
<meta name="theme-color" content="#14100E">
<link rel="icon" href="../../../assets/obol-logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Alegreya+Sans:wght@400;500&display=swap">
<style>
  /* Where Obol sends a browser tab when you turn back from a stream of Lethe. Kept tiny and static. */
  :root { --bg: #14100E; --glow: #3A2216; --ink: #F1E6D4; --muted: #BCA88F; --terra: #D9774A; --gold: #DDB45E; --lethe: #8FA4B2; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 32px 20px;
    background: radial-gradient(120% 70% at 50% 0%, var(--glow) 0%, transparent 60%), var(--bg);
    color: var(--ink); font-family: "Alegreya Sans", system-ui, sans-serif; text-align: center;
  }
  main { max-width: 26rem; display: grid; gap: 18px; justify-items: center; }
  svg.boat { width: min(100%, 320px); height: auto; }
  h1 { font-family: Forum, Georgia, serif; font-weight: 400; font-size: clamp(2rem, 7vw, 2.6rem); line-height: 1.15; margin: 0; letter-spacing: .02em; }
  p { margin: 0; font-size: 1.12rem; line-height: 1.5; color: var(--muted); }
  .key { width: 100%; height: 12px; background: repeating-linear-gradient(90deg, transparent 0 2px, rgba(217,119,74,.55) 2px 4px, transparent 4px 12px); opacity: .6; }
  small { color: var(--lethe); font-size: .95rem; }
  a { color: var(--gold); }
</style>
</head>
<body>
<main>
  <svg class="boat" viewBox="0 0 320 150" aria-hidden="true">
    <g fill="#D9774A">
      <path d="M38 107 L256 107 Q288 101 294 69 Q303 50 288 50 Q279 75 256 117 L64 117 Q38 114 38 107 Z"/>
      <path d="M74 107 Q77 47 92 33 Q102 22 110 34 Q114 44 110 52 Q122 75 118 107 Z"/>
    </g>
    <path d="M150 10 L52 138" stroke="#D9774A" stroke-width="4" stroke-linecap="round"/>
    <circle cx="288" cy="40" r="9" fill="#D9774A" opacity=".35"/><circle cx="288" cy="40" r="4" fill="#D9774A"/>
    <g fill="none" stroke="#8FA4B2" stroke-width="2" stroke-linecap="round">
      <path d="M0 126 q16 -6 32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0" opacity=".6"/>
      <path d="M0 138 q16 -6 32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0" opacity=".35"/>
    </g>
  </svg>
  <h1 id="t">Back on the shore</h1>
  <div class="key" aria-hidden="true"></div>
  <p id="p">Charon turned the boat around. The tab that led to Lethe is closed for now.</p>
  <p id="q">Maybe a page of a book, a lesson, or a few slow breaths?</p>
  <small id="s">Obol · Stillcraft</small>
</main>
<script>
  // Russian if the browser prefers it; nothing else is stored or sent.
  if ((navigator.language || "").toLowerCase().startsWith("ru")) {
    document.documentElement.lang = "ru";
    document.title = "Снова на берегу · Обол";
    document.getElementById("t").textContent = "Снова на берегу";
    document.getElementById("p").textContent = "Харон развернул лодку. Вкладка, что вела в Лету, пока закрыта.";
    document.getElementById("q").textContent = "Может, страница книги, урок или несколько медленных вдохов?";
    document.getElementById("s").textContent = "Обол · Stillcraft";
  }
</script>
</body>
</html>
